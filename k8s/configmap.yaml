apiVersion: v1
kind: ConfigMap
metadata:
  name: mar-cluster-config
  namespace: mar-system
  labels:
    app.kubernetes.io/part-of: mar-quadrupede
data:
  MQTT_BROKER: "mar-mosquitto"
  MQTT_PORT: "1883"
  WS_PORT: "8765"
  SERIAL_PORT: ""  # vuoto = ruolo identificato dal banner (vedi mar-serial-bridge/port_roles.py)
  SERIAL_BAUD: "115200"
  HEARTBEAT_SEC: "0.2"
  IMU_ENABLED: "true"
  IMU_I2C_BUS: "1"
  IMU_ADDRESS: "0x68"
  IMU_RATE_HZ: "100"
  IMU_CALIBRATION_SAMPLES: "100"
  IMU_CALIBRATION_TIMEOUT_S: "12"
  LIDAR_PORT: "/dev/ttyAMA0"
  LIDAR_BAUD: "230400"
  LIDAR_SIMULATE: "false"
  LIDAR_OFFSET_DEG: "90.0"
  LORA_ENABLED: "false"
  LORA_BACKEND: "auto"
  LORA_PORT: "/dev/ttyUSB1"
  LORA_BAUD: "9600"
  LORA_FREQ_MHZ: "868.0"
  LORA_TX_INTERVAL: "1.0"
  STREAM_PORT: "8080"
  DASHBOARD_PORT: "3000"
  POSTGRES_HOST: "mar-postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "mar_db"
  POSTGRES_USER: "mar_user"
  REDIS_HOST: "mar-redis"
  REDIS_PORT: "6379"
  REDIS_URL: "redis://mar-redis:6379"
  S3_ENDPOINT: "http://mar-s3:9000"
  S3_BUCKET: "mar-storage"
