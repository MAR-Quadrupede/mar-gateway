apiVersion: v1
kind: ConfigMap
metadata:
  name: mar-cluster-config
  namespace: mar-system
  labels:
    app.kubernetes.io/part-of: mar-quadrupede
data:
  MQTT_BROKER: "mar-mosquitto"
  MQTT_PORT: "1883"
  WS_PORT: "8765"
  SERIAL_PORT: "/dev/ttyACM0"
  SERIAL_BAUD: "115200"
  HEARTBEAT_SEC: "0.2"
  IMU_ENABLED: "true"
  IMU_I2C_BUS: "1"
  IMU_ADDRESS: "0x68"
  IMU_RATE_HZ: "100"
  IMU_CALIBRATION_SAMPLES: "100"
  IMU_CALIBRATION_TIMEOUT_S: "12"
  LIDAR_PORT: "/dev/ttyUSB0"
  LIDAR_SIMULATE: "false"
  LORA_ENABLED: "false"
  LORA_BACKEND: "auto"
  LORA_PORT: "/dev/ttyUSB0"
  LORA_BAUD: "9600"
  LORA_FREQ_MHZ: "868.0"
  LORA_TX_INTERVAL: "1.0"
  STREAM_PORT: "8080"
  DASHBOARD_PORT: "3000"
