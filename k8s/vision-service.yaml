apiVersion: apps/v1
kind: Deployment
metadata:
  name: mar-vision-service
  namespace: mar-system
  labels:
    app: mar-vision-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mar-vision-service
  template:
    metadata:
      labels:
        app: mar-vision-service
    spec:
      containers:
        - name: vision-service
          image: mar-vision-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8443
              name: stream-http
          envFrom:
            - configMapRef:
                name: mar-cluster-config
          env:
            - name: MAR_YOLO_ENABLE
              value: "1"
            - name: MAR_YOLO_PERIOD_S
              value: "0.5"
            - name: MAR_YOLO_IMGSZ
              value: "256"
            - name: MAR_YOLO_MODEL
              value: "yolov8n.pt"
            - name: MAR_STEREO_BM
              value: "0"
            - name: MAR_SGBM_DIV
              value: "4"
            - name: MAR_RECT_DIV
              value: "2"
            - name: MAR_STREAM_MAX_W
              value: "1280"
            - name: MAR_TARGET_STREAM_FPS
              value: "15"
            - name: MAR_RISK_EMA_ALPHA
              value: "0.35"
            - name: MAR_RISK_ESCALATE_S
              value: "0.20"
            - name: MAR_RISK_DEESCALATE_S
              value: "0.90"
            - name: MAR_FOV_ON_FRAMES
              value: "3"
            - name: MAR_FOV_OFF_FRAMES
              value: "6"
          securityContext:
            privileged: true
          volumeMounts:
            - name: dev-mount
              mountPath: /dev
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2500m
              memory: 2048Mi
      volumes:
        - name: dev-mount
          hostPath:
            path: /dev
---
apiVersion: v1
kind: Service
metadata:
  name: mar-vision-service
  namespace: mar-system
  labels:
    app: mar-vision-service
spec:
  type: NodePort
  selector:
    app: mar-vision-service
  ports:
    - name: stream-http
      port: 8443
      targetPort: 8443
      nodePort: 30080
