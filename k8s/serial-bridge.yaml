apiVersion: apps/v1
kind: Deployment
metadata:
  name: mar-serial-bridge
  namespace: mar-system
  labels:
    app: mar-serial-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mar-serial-bridge
  template:
    metadata:
      labels:
        app: mar-serial-bridge
    spec:
      containers:
        - name: serial-bridge
          image: mar-serial-bridge:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: mar-cluster-config
          securityContext:
            privileged: true
          volumeMounts:
            - name: dev-mount
              mountPath: /dev
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: dev-mount
          hostPath:
            path: /dev
