apiVersion: apps/v1
kind: Deployment
metadata:
  name: mar-serial-bridge
  namespace: mar-system
  labels:
    app: mar-serial-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mar-serial-bridge
  template:
    metadata:
      labels:
        app: mar-serial-bridge
    spec:
      containers:
        - name: serial-bridge
          image: mar-serial-bridge:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: mar-cluster-config
          env:
            # Le porte USB vengono assegnate per RUOLO (banner): nessuna porta forzata
            - name: SERIAL_PORT
              value: ""
            - name: ULTRASONIC_ENABLED
              value: "true"
            - name: ULTRASONIC_PORT
              value: ""
            - name: ULTRASONIC_BAUD
              value: "115200"
            - name: ULTRASONIC_AUTO_FALLBACK
              value: "false"
            - name: PORT_RESCAN_S
              value: "10"
          securityContext:
            privileged: true
          volumeMounts:
            - name: dev-mount
              mountPath: /dev
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: dev-mount
          hostPath:
            path: /dev
