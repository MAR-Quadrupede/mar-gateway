apiVersion: v1
kind: ServiceAccount
metadata:
  name: portainer-sa
  namespace: mar-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portainer-crb
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: portainer-sa
    namespace: mar-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portainer
  namespace: mar-system
  labels:
    app: portainer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portainer
  template:
    metadata:
      labels:
        app: portainer
    spec:
      serviceAccountName: portainer-sa
      containers:
        - name: portainer
          image: portainer/portainer-ce:2.19.4
          imagePullPolicy: IfNotPresent
          args:
            - "--tunnel-port=30788"
          ports:
            - containerPort: 9000
              name: http
            - containerPort: 9443
              name: https
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 30m
              memory: 40Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: portainer
  namespace: mar-system
  labels:
    app: portainer
spec:
  type: NodePort
  selector:
    app: portainer
  ports:
    - name: http
      port: 9000
      targetPort: 9000
      nodePort: 30900
    - name: https
      port: 9443
      targetPort: 9443
      nodePort: 30943
