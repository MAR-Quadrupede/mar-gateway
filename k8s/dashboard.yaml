apiVersion: apps/v1
kind: Deployment
metadata:
  name: mar-dashboard
  namespace: mar-system
  labels:
    app: mar-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mar-dashboard
  template:
    metadata:
      labels:
        app: mar-dashboard
    spec:
      containers:
        - name: dashboard
          image: mar-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: web-ui
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mar-dashboard-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mar-dashboard-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mar-dashboard
  namespace: mar-system
  labels:
    app: mar-dashboard
spec:
  type: NodePort
  selector:
    app: mar-dashboard
  ports:
    - name: web-ui
      port: 3000
      targetPort: 3000
      nodePort: 30000
